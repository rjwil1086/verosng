# The guest PE link uses the same Clang as the amd64 OS build.
# Build from env.cmd so tools\clang\bin is on PATH.
# Rust 1.99's gnu standard library needs the mingw libraries shipped
# with the gnu host toolchain. The OS gcc 8.4 sysroot does not.

[target.x86_64-pc-windows-gnu]
linker = "clang-link.exe"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-L../../../../tools/rust/rustup/toolchains/1.99.1-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu/lib/self-contained",
]
