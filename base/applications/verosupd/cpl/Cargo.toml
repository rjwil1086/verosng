[package]
name = "verosupd-cpl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "verosupd_cpl"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
verosupdsvc = { path = "../svc" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
