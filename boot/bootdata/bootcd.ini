[FREELOADER]
DefaultOS=LiveImg_Debug
TimeOut=10

[Display]
TitleText=VerOS NT Boot Media
MinimalUI=Yes

[Operating Systems]
Setup="VerOS NT Setup (Text Mode)"
LiveImg="VerOS NT Live Environment (Graphics Mode)"
==
;; The entries below are for testing and development:
Setup_Debug="Setup (Debug)"
Setup_Screen="Setup (Screen Debug)"
LiveImg_Debug="Live (Debug)"
LiveImg_VBoxDebug="Live (VBox Debug)"
LiveImg_Screen="Live (Screen Debug)"
LiveImg_RamDisk_Debug="Live - RamDisk (Debug)"

;; The following entry is an example template:
;LiveImg_LogFile="Live (Log file)"

[Setup]
BootType=VerOSSetup

[Setup_Debug]
BootType=VerOSSetup
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE

[Setup_Screen]
BootType=VerOSSetup
Options=/DEBUG /DEBUGPORT=SCREEN /SIFOPTIONSOVERRIDE

[LiveImg]
BootType=Windows2003
SystemPath=\VerOS
Options=/FASTDETECT /MININT

[LiveImg_Debug]
BootType=Windows2003
SystemPath=\VerOS
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveImg_VBoxDebug]
BootType=Windows2003
SystemPath=\VerOS
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveImg_Screen]
BootType=Windows2003
SystemPath=\VerOS
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT

[LiveImg_RamDisk_Debug]
BootType=Windows2003
SystemPath=ramdisk(0)\VerOS
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH= /RDEXPORTASCD
;Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT /RDPATH=liveimg.iso /RDEXPORTASCD

;[LiveImg_LogFile]
;BootType=Windows2003
;SystemPath=\VerOS
;Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
